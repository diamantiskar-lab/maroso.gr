<title>ΜΑΡΟΖΩ — maroso.gr</title>

<meta property="og:image" content="https://maroso.gr/img/niovi.jpg">
<style>
:root{--bg:#000;--muted:#8a8a8a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--muted);font:12px/1.4 Helvetica,Arial,sans-serif;display:flex;justify-content:center}
/* original iWeb canvas: 1024 x 1060, scaled fluidly */
.stage{position:relative;width:min(1024px,100vw);aspect-ratio:1024/1080;overflow:hidden}
.stage > *{position:absolute}
.face{left:15.53%;top:4.54%;width:70.7%;opacity:.62;box-shadow:0 0 40px rgba(0,0,0,.9)}
.reflection{left:15.53%;top:73.8%;width:70.7%;opacity:.62;transform:scaleY(-1);
  -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.35),transparent 18%);mask-image:linear-gradient(to top,rgba(0,0,0,.35),transparent 18%)}
.word{left:12.99%;top:63.4%;width:106.1%}
footer{left:0;right:0;top:95.5%;text-align:center}
footer a{color:inherit;text-decoration:none}
footer a:hover{color:#ccc}
</style>
</head>
<body>
<main class="stage">
  <img class="face" src="img/niovi.jpg" alt="Artwork by Diamantis Karanastasis" width="724" height="747">
  <img class="reflection" src="img/niovi.jpg" alt="" aria-hidden="true" width="724" height="747">
  <img class="word" src="img/maroso.png" alt="ΜΑΡΟΖΩ" width="1087" height="478">
  <footer>maroso.gr · © 2012 Diamantis Karanastasis · <a href="https://diamantiskaranastasis.com">diamantiskaranastasis.com</a></footer>
</main>
</body>
